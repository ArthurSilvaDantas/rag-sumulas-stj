[project]
name = "rag-stj"
version = "0.1.0"
description = "RAG de consonância com súmulas e precedentes qualificados do STJ (Qdrant + Ollama)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "ollama>=0.4",
    "pandas>=2.2",
    "pypdf>=5.0",
    "qdrant-client>=1.15",
    "requests>=2.32",
]

[tool.uv]
package = false
